<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Funky's 2P Games</title>
<link rel="stylesheet" href="devine-ui.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f0f1a;color:#f0f0f0;touch-action:none;user-select:none;-webkit-user-select:none}
/* ---- Home ---- */
#menu{display:grid;grid-template-columns:minmax(0,560px);justify-content:center;gap:12px;padding:12px 16px calc(24px + env(safe-area-inset-bottom));padding-top:calc(10px + env(safe-area-inset-top));height:100vh;overflow-y:auto;align-content:start;touch-action:pan-y;
  background:
    radial-gradient(60% 40% at 15% 0%,rgba(124,77,255,.35),transparent 70%),
    radial-gradient(50% 35% at 90% 10%,rgba(0,188,212,.28),transparent 70%),
    radial-gradient(70% 50% at 50% 110%,rgba(255,112,67,.18),transparent 70%),
    #0b0b16;background-attachment:fixed}
#menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 10px}
#menu-head h1{font-size:1.75em;font-weight:800;letter-spacing:-.5px;line-height:1.1;background:linear-gradient(90deg,#FFD54F,#FF8A65 55%,#F06292);-webkit-background-clip:text;background-clip:text;color:transparent}
#menu-head .sub{margin-top:6px;font-size:.82em;color:rgba(240,240,255,.62);letter-spacing:.2px}
#menu-music-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:1.25em;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .2s}
#menu-music-btn:active{transform:scale(.92);background:rgba(255,255,255,.16)}
/* One tile per row: medallion, name + one-line description, chevron, ghost icon in the corner */
.card{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;padding:14px 16px 14px 14px;border-radius:22px;cursor:pointer;min-height:86px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
  animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 0% 0%,rgba(255,255,255,.24),rgba(255,255,255,0) 55%),linear-gradient(180deg,rgba(255,255,255,0),rgba(0,0,0,.22));pointer-events:none}
.card:active{transform:scale(.97);box-shadow:0 4px 12px rgba(0,0,0,.35)}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}}
.card .ghost{position:absolute;right:-8px;bottom:-24px;font-size:5.2em;line-height:1;opacity:.13;transform:rotate(-14deg);filter:blur(.5px);pointer-events:none}
.card .icon{position:relative;flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.85em;line-height:1;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.25);text-shadow:0 2px 6px rgba(0,0,0,.35)}
.card .text{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .name{font-size:1.08em;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.card .desc{font-size:.82em;line-height:1.3;color:rgba(255,255,255,.82);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.menu-credits{text-align:center;font-size:.72em;color:rgba(240,240,255,.4);padding:14px 0 8px}
@keyframes cardIn{from{opacity:0;transform:translateX(18px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
/* ---- Game shell ---- */
#game{display:none;flex-direction:column;height:100vh;width:100vw;--game-rgb:42,79,149;
  background:radial-gradient(90% 50% at 50% 0%,rgba(var(--game-rgb),.30),transparent 72%),radial-gradient(80% 42% at 50% 100%,rgba(var(--game-rgb),.20),transparent 70%),#0b1024}
#game-header{display:flex;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(8,11,28,.55);border-bottom:1px solid rgba(255,255,255,.07);box-shadow:0 1px 0 rgba(0,0,0,.35);gap:10px;min-height:52px;z-index:10}
#back-btn{background:none;border:none;color:#f0f0f0;font-size:1.5em;cursor:pointer;padding:6px 10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
#game-title{font-family:"DM Plaque",Georgia,serif;font-weight:700;font-size:1.2em;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#game-status{font-size:1.2em;color:#FFD54F;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#game-status:empty{display:none}
#game-status .turn-active{font-size:1.15em;font-weight:900;text-shadow:0 0 8px currentColor,0 0 16px currentColor;animation:turnPulse 1.5s ease-in-out infinite}
@keyframes turnPulse{0%,100%{opacity:1}50%{opacity:0.7}}
#info-btn{border-color:rgba(255,255,255,.22)!important;background:rgba(255,255,255,.06)!important}
/* Score bar shared by the board games (cards = .dv-player of the word games) */
#game-scorebar{display:none;padding:8px 12px 4px;flex:none}
#game-scorebar.on{display:flex}
#game-scorebar .dv-pts{font-family:"DM Plaque",Georgia,serif}
#game-scorebar .dv-name{display:flex;align-items:center;gap:5px;font-weight:600}
#game-scorebar .sb-sub{font-size:.7em;color:rgba(240,240,255,.6);min-height:0}
#game-scorebar .sb-sub:empty{display:none}
#game-scorebar .sb-mid{flex:1;min-width:0;font-size:.82em;line-height:1.25;color:rgba(240,240,255,.7)}
.sb-chip{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.2)}
#game-scorebar.sb-compact{padding:5px 10px 3px}
#game-scorebar.sb-compact .dv-player{flex-direction:row;gap:8px;padding:3px 12px;min-width:84px;justify-content:center}
#game-scorebar.sb-compact .dv-pts{font-size:1.25em}
#game-scorebar.sb-compact .dv-player{opacity:1;border-color:color-mix(in srgb,var(--pc) 45%,transparent);background:color-mix(in srgb,var(--pc) 8%,transparent)}
#game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:transparent}
#game-area canvas{display:block}
.wood-frame{position:relative;padding:8px;border-radius:16px;background:linear-gradient(145deg,#8a5a2b,#5a3615 45%,#7a4b22 70%,#4a2a0e);box-shadow:inset 0 1px 0 rgba(255,230,190,.35),inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.5),0 16px 34px rgba(0,0,0,.55)}
.c4-plate{display:grid;gap:5px;padding:12px;border-radius:18px;position:relative;
  background:linear-gradient(180deg,#3a8ef0,#1b63c6 45%,#124c9e);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.45),0 18px 36px rgba(0,0,0,.55)}
.c4-hole{aspect-ratio:1;border-radius:50%;position:relative;cursor:pointer;background:radial-gradient(circle at 50% 38%,#121a38,#070b1a 75%);box-shadow:inset 0 4px 7px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.28),0 -1px 0 rgba(0,0,0,.25)}
.c4-disc{position:absolute;inset:3%;border-radius:50%;animation:c4Fall ease-in both;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 5px rgba(255,255,255,.14),inset 0 -3px 5px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.5);z-index:2}
.c4-1{background:radial-gradient(circle at 38% 32%,#ff8a80,#e53935 50%,#a31515)}
.c4-2{background:radial-gradient(circle at 38% 32%,#fff59d,#fdd835 50%,#c49000)}
.c4-over .c4-disc:not(.c4-win){filter:brightness(.6) saturate(.8);transition:filter .4s}
.c4-win::after{content:'';position:absolute;inset:-2px;border-radius:50%;animation:c4Glow 1.1s ease-in-out .25s infinite alternate}
@keyframes c4Fall{0%{transform:translateY(var(--fall,-300%))}82%{transform:translateY(0)}91%{transform:translateY(-6%)}100%{transform:translateY(0)}}
@keyframes c4Glow{from{box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 10px 2px rgba(255,255,255,.55)}to{box-shadow:0 0 0 3px #fff,0 0 22px 7px rgba(255,255,255,.85)}}
@media(prefers-reduced-motion:reduce){.c4-disc,.c4-win::after{animation:none}}
.mm-card{perspective:600px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mm-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .22s ease-out}
.mm-up .mm-inner{transform:rotateY(180deg)}
.mm-back,.mm-face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.mm-back{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.16) 0 9%,transparent 10%),repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 5px,transparent 5px 10px),linear-gradient(150deg,#9c3cc4,#5e1a86);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 0 0 5px rgba(0,0,0,.18),inset 0 0 0 6px rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.45)}
.mm-face{transform:rotateY(180deg);background:linear-gradient(180deg,#f6f2e8,#e3dccb);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08),inset 0 -3px 0 rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.45)}
.mm-p0 .mm-face{box-shadow:inset 0 0 0 3px #FF6B6B,0 0 12px rgba(255,107,107,.55);background:linear-gradient(180deg,#fbe9e7,#f0d0cb)}
.mm-p1 .mm-face{box-shadow:inset 0 0 0 3px #64B5F6,0 0 12px rgba(100,181,246,.55);background:linear-gradient(180deg,#e7f1fb,#cfe0f0)}
.mm-p0,.mm-p1{animation:mmMatch .35s ease-out}
@keyframes mmMatch{50%{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.mm-inner{transition:none}.mm-p0,.mm-p1{animation:none}}
.aw-board{padding:12px;border-radius:22px;background:linear-gradient(160deg,#8a5a2b,#6a4019 40%,#7d4f24 70%,#53300f);box-shadow:inset 0 2px 0 rgba(255,230,190,.3),inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.5),0 18px 36px rgba(0,0,0,.55)}
.aw-pit{padding:8px 4px;border-radius:50%/42%;text-align:center;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(ellipse at 50% 30%,#2a170a,#3f2412 60%,#5a361a);box-shadow:inset 0 6px 10px rgba(0,0,0,.6),inset 0 -2px 3px rgba(255,220,170,.12),0 1px 0 rgba(255,230,190,.25);transition:box-shadow .2s}
.aw-pit.aw-live{box-shadow:inset 0 6px 10px rgba(0,0,0,.6),inset 0 -2px 3px rgba(255,220,170,.12),0 0 0 2px rgba(255,213,79,.55),0 0 10px rgba(255,213,79,.25)}
.aw-n{font-size:.62em;color:rgba(255,235,210,.6);margin-top:1px;font-weight:600}
.aw-seed{width:13px;height:16px;border-radius:50%;box-shadow:inset -1px -2px 2px rgba(0,0,0,.45),0 1px 1px rgba(0,0,0,.5)}
.aw-label{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:0 auto 10px;width:max-content;padding:3px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);opacity:.6;transition:all .3s;color:var(--pc);font-weight:700}
.aw-label:last-child{margin:10px auto 0}
.aw-label b{font-family:"DM Plaque",Georgia,serif;font-size:1.35em;color:#fff}
.aw-label.aw-on{opacity:1;border-color:var(--pc);box-shadow:0 0 14px color-mix(in srgb,var(--pc) 50%,transparent);background:color-mix(in srgb,var(--pc) 14%,rgba(0,0,0,.25))}
.caro-grid{border-radius:6px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,rgba(255,240,200,.35),transparent 60%),repeating-linear-gradient(96deg,rgba(120,80,20,.08) 0 3px,transparent 3px 11px),linear-gradient(160deg,#dcb661,#c99d45 55%,#b98a35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 18px rgba(80,50,10,.25)}
.caro-last::after{content:'';position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:var(--mk)}
.hm-svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.hm-new{stroke-dasharray:1;stroke-dashoffset:1;animation:hmDraw .35s ease-out forwards}
@keyframes hmDraw{to{stroke-dashoffset:0}}
.hm-misses{display:flex;gap:7px;justify-content:center;margin:4px 0}
.hm-misses i{width:10px;height:10px;border-radius:50%;background:rgba(238,241,236,.18);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.hm-misses i.hm-used{background:#e05555;box-shadow:0 0 8px rgba(224,85,85,.6)}
@media(prefers-reduced-motion:reduce){.hm-new{animation:none;stroke-dashoffset:0}}
.board-game{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;width:100%;height:100%;justify-content:center}
/* Buttons: pills, as in Word Clash */
.btn{background:rgba(238,241,236,.08);color:#eef1ec;border:1px solid rgba(238,241,236,.18);border-radius:999px;padding:8px 18px;font:600 .92em system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 10px rgba(0,0,0,.3);transition:background .2s,transform .12s;-webkit-tap-highlight-color:transparent}
.btn:active{background:rgba(238,241,236,.16);transform:scale(.96)}
@media(hover:hover){.btn:hover{background:rgba(238,241,236,.14)}}
.btn-main{background:linear-gradient(180deg,var(--game-hi,#4b8fd6),var(--game,#2f6db0));border-color:rgba(255,255,255,.25);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px rgba(var(--game-rgb),.35),0 2px 6px rgba(0,0,0,.4)}
.btn-main:active{background:linear-gradient(180deg,var(--game,#2f6db0),var(--game,#2f6db0))}
.overlay{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 45%,rgba(var(--game-rgb,42,79,149),.22),transparent 75%),rgba(8,11,28,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:12px;font-size:1.1em;animation:fadeIn .2s ease-out}
.ov-x{position:absolute;top:10px;right:14px;background:none;border:none;color:#fff;font-size:2em;cursor:pointer;line-height:1;opacity:.7}
.ov-card{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:calc(100% - 40px);padding:24px 30px 22px;border-radius:22px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 18px 40px rgba(0,0,0,.45);animation:ovPop .28s cubic-bezier(.2,1.3,.4,1)}
.ov-title{font-family:"DM Plaque",Georgia,serif;font-size:1.75em;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(var(--game-rgb,42,79,149),.6)}
.ov-sub{font-size:.9em;color:rgba(240,240,255,.72);line-height:1.5}
.ov-msg{font-size:1.15em;font-weight:700;line-height:1.35}
.overlay .btn{font-size:1em;padding:11px 28px}
@keyframes ovPop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* Turn change: a short toast, same family as the word games */
.turn-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none;animation:flashTurn 1.1s ease-out forwards}
.tf-box{padding:14px 28px;border-radius:999px;background:rgba(10,14,32,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:2px solid var(--pc);box-shadow:0 0 0 4px rgba(0,0,0,.25),0 0 26px color-mix(in srgb,var(--pc) 55%,transparent),0 10px 30px rgba(0,0,0,.45);
  font-family:"DM Plaque",Georgia,serif;font-size:1.5em;color:var(--pc);text-shadow:0 0 14px color-mix(in srgb,var(--pc) 70%,transparent);letter-spacing:.3px;white-space:nowrap}
@keyframes flashTurn{0%{opacity:0;transform:scale(0.8)}15%{opacity:1;transform:scale(1.04)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ov-card,.turn-flash{animation-duration:.01s}.turn-flash{animation:none;opacity:1}}
/* ---- Devine-moi duel (board and keyboard styles: devine-ui.css) ---- */
.dv-wrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:560px;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
.dv-score{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 4px}
.dv-player{position:relative;display:flex;flex-direction:column;align-items:center;min-width:92px;padding:6px 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,.08);opacity:.5;transition:all .3s}
.dv-player .dv-name{font-size:.78em;color:var(--pc)}
.dv-player .dv-pts{font-size:1.5em;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.dv-player.dv-active{opacity:1;border-color:var(--pc);box-shadow:0 0 16px color-mix(in srgb,var(--pc) 45%,transparent);background:color-mix(in srgb,var(--pc) 12%,transparent)}
.dv-round{font-size:.85em;color:rgba(240,240,255,.6);text-align:center}
.dv-gain{position:absolute;top:-6px;right:-6px;font-style:normal;font-weight:900;color:#FFD54F;opacity:0;pointer-events:none}
.dv-gain.dv-show{animation:dvGain 1.2s ease-out}
@keyframes dvGain{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:translateY(-4px)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.dv-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.dv-kbd{padding-top:6px}
.dv-kbd .dm-key[data-key="ENTER"]{color:#0c1430;font-weight:700}  /* readable on the light player colours */
@keyframes rvPlace{0%{transform:scale(0)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
/* ---- Word Clash (tiles: devine-ui.css) ---- */
.wc-wrap{--p0:#c84646;--p0-hi:#e66262;--p1:#2f6db0;--p1-hi:#4b8fd6;--pc:#FF6B6B;position:relative;display:flex;flex-direction:column;align-items:center;width:100%;height:100%;max-width:560px;padding:10px 4px calc(10px + env(safe-area-inset-bottom));
  background:radial-gradient(80% 45% at 50% 0%,rgba(42,79,149,.28),transparent 70%),radial-gradient(70% 40% at 50% 100%,rgba(28,58,116,.3),transparent 70%)}
.wc-wrap .dv-score{width:100%}
.wc-p0{--f:var(--p0);--f-hi:var(--p0-hi)}
.wc-p1{--f:var(--p1);--f-hi:var(--p1-hi)}
.wc-stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.wc-grid{display:grid;justify-content:center;perspective:700px}
.wc-cell[data-state="empty"]{background:rgba(238,241,236,.06);box-shadow:inset 0 0 0 1.5px rgba(238,241,236,.16),inset 0 2px 6px rgba(0,0,0,.35)}
.wc-cell.wc-hinted{color:#f0b93a}
.wc-info{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:420px;padding:4px 10px;font-size:.82em;color:rgba(240,240,255,.62)}
.wc-info>span{flex:1}
.wc-info .wc-bonus{text-align:right;color:#f0b93a}
.wc-hint{flex:none;border:1px solid rgba(238,241,236,.18);background:rgba(238,241,236,.07);color:#eef1ec;border-radius:999px;padding:7px 14px;font:600 .95em system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .2s}
.wc-hint small{color:#FF8A80;font-weight:700;margin-left:2px}
.wc-hint:active{transform:scale(.94);background:rgba(238,241,236,.14)}
.wc-hint:disabled{opacity:.35;pointer-events:none}
.wc-word{--tile:34px;position:relative;display:flex;gap:4px;justify-content:center;align-items:center;height:56px;margin:2px 0 6px}
.wc-word .dm-tile{font-size:calc(var(--tile)*.6)}
.wc-word.dm-shake{animation:dmShake .4s ease-in-out}
.wc-word.wc-bounce .dm-tile{animation:dmBounce .5s cubic-bezier(.3,.6,.4,1)}
.wc-note{position:absolute;top:-14px;left:0;right:0;text-align:center;font-size:.8rem;font-weight:800;color:#FFD54F;text-shadow:0 1px 4px rgba(0,0,0,.6);animation:fadeIn .2s}
.wc-note.wc-bad{color:#FF8A80}
.wc-wheel{position:relative;flex:none;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 40%,rgba(42,79,149,.55),rgba(12,20,48,.85) 70%);
  box-shadow:inset 0 0 0 2px rgba(238,241,236,.12),inset 0 6px 18px rgba(0,0,0,.45),0 12px 30px rgba(0,0,0,.4)}
.wc-trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wc-trail polyline{fill:none;stroke:var(--pc);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.75;filter:drop-shadow(0 0 6px var(--pc))}
.wc-key{position:absolute;border-radius:50%!important;cursor:pointer;transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1),transform .1s}
.wc-key::after{border-radius:50%!important}
.wc-key.wc-on{--f:var(--p0);--f-hi:var(--p0-hi);transform:scale(1.1)}
.wc-wheel.wc-p1 .wc-key.wc-on{--f:var(--p1);--f-hi:var(--p1-hi)}
.wc-shuffle{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:1px solid rgba(238,241,236,.2);background:rgba(12,20,48,.7);color:#eef1ec;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s}
.wc-shuffle:active{transform:rotate(180deg) scale(.9)}
.wc-shuffle svg{width:22px;height:22px}
.wc-sum{max-width:320px;margin:10px auto 6px;font:700 .8em/1.6 "DM Plaque",Georgia,serif;letter-spacing:.04em}
.wc-picker{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%}
.wc-title{--tile:30px;display:flex;gap:4px;margin-bottom:18px}
.wc-title i{width:10px}
.wc-pick-label{color:rgba(240,240,255,.65);font-size:.95em}
.wc-lang{width:220px;padding:15px;border-radius:16px;border:1px solid rgba(238,241,236,.18);background:rgba(238,241,236,.07);color:#eef1ec;font:700 1.15em "DM Plaque",Georgia,serif;letter-spacing:.03em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.wc-lang.wc-def{background:linear-gradient(180deg,#2a4f95,#1c3a74);box-shadow:inset 0 0 0 2px #1c3a74,inset 0 0 0 3.5px #eef1ec,0 4px 0 rgba(0,0,0,.35)}
.wc-lang:active{transform:scale(.96)}
@media(prefers-reduced-motion:reduce){.wc-key{transition:none}.wc-word.wc-bounce .dm-tile,.wc-word.dm-shake{animation:none}}
</style>
</head>
<body>
<div id="menu">
<header id="menu-head">
<div><h1>Funky's 2P Games</h1><p class="sub">16 games &middot; two players &middot; one phone</p></div>
<button id="menu-music-btn" aria-label="Music" onclick="if(typeof SND!=='undefined'){const on=SND.musicToggle();this.textContent=on?'\u{1F50A}':'\u{1F507}';document.querySelectorAll('#music-btn').forEach(b=>b.textContent=on?'\u{1F50A}':'\u{1F507}')}"></button>
</header>
</div>
<div id="game">
<div id="game-header">
<button id="back-btn">&#9664;</button>
<span id="game-title"></span>
<span id="game-status"></span>
</div>
<div id="game-scorebar" class="dv-score"></div>
<div id="game-area"></div>
</div>
<script src="devine-words.js"></script>
<script src="wordclash-fr.js"></script>
<script src="devine-core.js"></script>
<script src="devine-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
