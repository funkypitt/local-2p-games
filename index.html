<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Funky's 2P Games</title>
<link rel="stylesheet" href="devine-ui.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f0f1a;color:#f0f0f0;touch-action:none;user-select:none;-webkit-user-select:none}
/* ---- Home ---- */
#menu{display:grid;grid-template-columns:minmax(0,560px);justify-content:center;gap:12px;padding:12px 16px calc(24px + env(safe-area-inset-bottom));padding-top:calc(10px + env(safe-area-inset-top));height:100vh;overflow-y:auto;align-content:start;touch-action:pan-y;
  background:
    radial-gradient(60% 40% at 15% 0%,rgba(124,77,255,.35),transparent 70%),
    radial-gradient(50% 35% at 90% 10%,rgba(0,188,212,.28),transparent 70%),
    radial-gradient(70% 50% at 50% 110%,rgba(255,112,67,.18),transparent 70%),
    #0b0b16;background-attachment:fixed}
#menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 10px}
#menu-head h1{font-size:1.75em;font-weight:800;letter-spacing:-.5px;line-height:1.1;background:linear-gradient(90deg,#FFD54F,#FF8A65 55%,#F06292);-webkit-background-clip:text;background-clip:text;color:transparent}
#menu-head .sub{margin-top:6px;font-size:.82em;color:rgba(240,240,255,.62);letter-spacing:.2px}
#menu-music-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:1.25em;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .2s}
#menu-music-btn:active{transform:scale(.92);background:rgba(255,255,255,.16)}
/* One tile per row: medallion, name + one-line description, chevron, ghost icon in the corner */
.card{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;padding:14px 16px 14px 14px;border-radius:22px;cursor:pointer;min-height:86px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
  animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 0% 0%,rgba(255,255,255,.24),rgba(255,255,255,0) 55%),linear-gradient(180deg,rgba(255,255,255,0),rgba(0,0,0,.22));pointer-events:none}
.card:active{transform:scale(.97);box-shadow:0 4px 12px rgba(0,0,0,.35)}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}}
.card .ghost{position:absolute;right:-8px;bottom:-24px;font-size:5.2em;line-height:1;opacity:.13;transform:rotate(-14deg);filter:blur(.5px);pointer-events:none}
.card .icon{position:relative;flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.85em;line-height:1;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.25);text-shadow:0 2px 6px rgba(0,0,0,.35)}
.card .text{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .name{font-size:1.08em;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.card .desc{font-size:.82em;line-height:1.3;color:rgba(255,255,255,.82);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.menu-credits{text-align:center;font-size:.72em;color:rgba(240,240,255,.4);padding:14px 0 8px}
@keyframes cardIn{from{opacity:0;transform:translateX(18px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
/* ---- Game shell ---- */
#game{display:none;flex-direction:column;height:100vh;width:100vw}
#game-header{display:flex;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:#1a1a2e;border-bottom:1px solid rgba(255,255,255,.08);gap:10px;min-height:52px;z-index:10}
#back-btn{background:none;border:none;color:#f0f0f0;font-size:1.5em;cursor:pointer;padding:6px 10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
#game-title{font-weight:700;font-size:1.15em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#game-status{font-size:1.2em;color:#FFD54F;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap}
#game-status .turn-active{font-size:1.15em;font-weight:900;text-shadow:0 0 8px currentColor,0 0 16px currentColor;animation:turnPulse 1.5s ease-in-out infinite}
@keyframes turnPulse{0%,100%{opacity:1}50%{opacity:0.7}}
#game-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#0f0f1a}
#game-area canvas{display:block}
.board-game{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;width:100%;height:100%;justify-content:center}
.btn{background:#2a2a4a;color:#f0f0f0;border:none;border-radius:8px;padding:8px 16px;font-size:.9em;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.btn:active{background:#3a3a5a;transform:scale(.97)}
@media(hover:hover){.btn:hover{background:#3a3a5a}}
.overlay{position:absolute;inset:0;background:rgba(15,15,26,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:12px;font-size:1.1em;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay .btn{font-size:1em;padding:10px 24px}
@keyframes flashTurn{0%{opacity:0;transform:scale(0.7)}15%{opacity:1;transform:scale(1.05)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
/* ---- Devine-moi duel (board and keyboard styles: devine-ui.css) ---- */
.dv-wrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:560px;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
.dv-score{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 4px}
.dv-player{position:relative;display:flex;flex-direction:column;align-items:center;min-width:92px;padding:6px 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,.08);opacity:.5;transition:all .3s}
.dv-player .dv-name{font-size:.78em;color:var(--pc)}
.dv-player .dv-pts{font-size:1.5em;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.dv-player.dv-active{opacity:1;border-color:var(--pc);box-shadow:0 0 16px color-mix(in srgb,var(--pc) 45%,transparent);background:color-mix(in srgb,var(--pc) 12%,transparent)}
.dv-round{font-size:.85em;color:rgba(240,240,255,.6);text-align:center}
.dv-gain{position:absolute;top:-6px;right:-6px;font-style:normal;font-weight:900;color:#FFD54F;opacity:0;pointer-events:none}
.dv-gain.dv-show{animation:dvGain 1.2s ease-out}
@keyframes dvGain{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:translateY(-4px)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.dv-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.dv-kbd{padding-top:6px}
.dv-kbd .dm-key[data-key="ENTER"]{color:#0c1430;font-weight:700}  /* readable on the light player colours */
@keyframes rvPlace{0%{transform:scale(0)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="menu">
<header id="menu-head">
<div><h1>Funky's 2P Games</h1><p class="sub">16 games &middot; two players &middot; one phone</p></div>
<button id="menu-music-btn" aria-label="Music" onclick="if(typeof SND!=='undefined'){const on=SND.musicToggle();this.textContent=on?'\u{1F50A}':'\u{1F507}';document.querySelectorAll('#music-btn').forEach(b=>b.textContent=on?'\u{1F50A}':'\u{1F507}')}"></button>
</header>
</div>
<div id="game">
<div id="game-header">
<button id="back-btn">&#9664;</button>
<span id="game-title"></span>
<span id="game-status"></span>
</div>
<div id="game-area"></div>
</div>
<script src="devine-words.js"></script>
<script src="devine-core.js"></script>
<script src="devine-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
